# Headlamp Admin Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-admin
  namespace: kube-system
---
# ClusterRoleBinding for full cluster access
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-admin-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: headlamp-admin
    namespace: kube-system
---
# Headlamp Admin Token Secret (following official docs)
apiVersion: v1
kind: Secret
metadata:
  name: headlamp-admin
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: "headlamp-admin"
type: kubernetes.io/service-account-token
---
# Headlamp Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: kube-system
  labels:
    app: headlamp
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: headlamp
  template:
    metadata:
      labels:
        k8s-app: headlamp
    spec:
      serviceAccountName: headlamp-admin
      containers:
        - name: headlamp
          image: ghcr.io/headlamp-k8s/headlamp:v0.24.0
          args:
            - "-in-cluster"
            - "-plugins-dir=/headlamp/plugins"
          ports:
            - containerPort: 4466
              name: http
          resources:
            requests: 
              cpu: "80m"
              memory: "192Mi"
            limits: 
              cpu: "300m" 
              memory: "384Mi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              scheme: HTTP
              path: /
              port: 4466
            initialDelaySeconds: 30
            timeoutSeconds: 30
          livenessProbe:
            httpGet:
              scheme: HTTP
              path: /
              port: 4466
            initialDelaySeconds: 30
            timeoutSeconds: 30
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: headlamp-config
              mountPath: /home/headlamp/.config
            - name: headlamp-plugins
              mountPath: /headlamp/plugins
      volumes:
        - name: tmp
          emptyDir: {}
        - name: headlamp-config
          emptyDir: {}
        - name: headlamp-plugins
          emptyDir: {}
---
# Headlamp Service
apiVersion: v1
kind: Service
metadata:
  name: my-headlamp
  namespace: kube-system
  labels:
    app: headlamp
spec:
  type: ClusterIP
  selector:
    k8s-app: headlamp
  ports:
    - name: http
      port: 80
      targetPort: 4466
      protocol: TCP
