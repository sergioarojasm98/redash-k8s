# =============================================================================
# HEADLAMP - Kubernetes Web UI
# =============================================================================
# Headlamp provides a web-based dashboard for Kubernetes cluster management.
# Deployed in kube-system namespace with cluster-admin access.
#
# Access: Via Cloudflare Tunnel at https://hl-redash.redsign98.net
# Auth: Token-based (generate with: kubectl create token headlamp-admin -n kube-system)
# =============================================================================

# -----------------------------------------------------------------------------
# ServiceAccount: headlamp-admin
# Dedicated account for Headlamp with cluster-wide access
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-admin
  namespace: kube-system
  labels:
    app: headlamp

---
# -----------------------------------------------------------------------------
# ClusterRoleBinding: headlamp-admin-binding
# Grants cluster-admin role to Headlamp service account
# WARNING: Full cluster access - secure the UI endpoint
# -----------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-admin-binding
  labels:
    app: headlamp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: headlamp-admin
    namespace: kube-system

---
# -----------------------------------------------------------------------------
# Secret: headlamp-admin token
# Long-lived token for service account authentication
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: headlamp-admin
  namespace: kube-system
  labels:
    app: headlamp
  annotations:
    kubernetes.io/service-account.name: "headlamp-admin"
type: kubernetes.io/service-account-token

---
# -----------------------------------------------------------------------------
# Deployment: headlamp
# Kubernetes dashboard with in-cluster authentication
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: kube-system
  labels:
    app: headlamp
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: headlamp
  template:
    metadata:
      labels:
        k8s-app: headlamp
    spec:
      serviceAccountName: headlamp-admin
      containers:
        - name: headlamp
          image: ghcr.io/headlamp-k8s/headlamp:v0.24.0
          args:
            - "-in-cluster"
            - "-plugins-dir=/headlamp/plugins"
          ports:
            - containerPort: 4466
              name: http
          resources:
            requests:
              cpu: "80m"
              memory: "192Mi"
            limits:
              cpu: "300m"
              memory: "384Mi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              scheme: HTTP
              path: /
              port: 4466
            initialDelaySeconds: 30
            timeoutSeconds: 30
          livenessProbe:
            httpGet:
              scheme: HTTP
              path: /
              port: 4466
            initialDelaySeconds: 30
            timeoutSeconds: 30
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: headlamp-config
              mountPath: /home/headlamp/.config
            - name: headlamp-plugins
              mountPath: /headlamp/plugins
      volumes:
        - name: tmp
          emptyDir: {}
        - name: headlamp-config
          emptyDir: {}
        - name: headlamp-plugins
          emptyDir: {}

---
# -----------------------------------------------------------------------------
# Service: my-headlamp
# Internal service for Cloudflare tunnel access
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: my-headlamp
  namespace: kube-system
  labels:
    app: headlamp
spec:
  type: ClusterIP
  selector:
    k8s-app: headlamp
  ports:
    - name: http
      port: 80
      targetPort: 4466
      protocol: TCP
