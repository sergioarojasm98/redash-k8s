# =============================================================================
# SECRETS - Sensitive Configuration
# =============================================================================
# All secrets are populated from .env via deploy.sh using envsubst.
# DO NOT commit this file with actual values - use .env.example as template.
#
# Required environment variables in .env:
# - REDASH_COOKIE_SECRET: Session cookie encryption key
# - REDASH_SECRET_KEY: Application secret for tokens
# - POSTGRES_PASSWORD: Password for the local PostgreSQL instance
# =============================================================================

# -----------------------------------------------------------------------------
# Secret: redash-core-secrets
# Core application secrets for Redash security
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: redash-core-secrets
  namespace: redash
  labels:
    app: redash
type: Opaque
stringData:
  REDASH_COOKIE_SECRET: "${REDASH_COOKIE_SECRET}"
  REDASH_SECRET_KEY: "${REDASH_SECRET_KEY}"

---
# -----------------------------------------------------------------------------
# Secret: redash-database-secrets
# PostgreSQL credentials for local database
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: redash-database-secrets
  namespace: redash
  labels:
    app: redash
type: Opaque
stringData:
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
  REDASH_DATABASE_URL: "postgresql://redash:${POSTGRES_PASSWORD}@redash-postgres.redash.svc.cluster.local:5432/redash"
