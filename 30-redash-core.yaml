apiVersion: v1
kind: Service
metadata:
  name: redash-web
  namespace: redash
spec:
  type: ClusterIP
  selector: { app: redash, comp: web }
  ports:
    - name: http
      port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redash-web
  namespace: redash
  labels: { app: redash, comp: web }
spec:
  replicas: 1
  selector: { matchLabels: { app: redash, comp: web } }
  template:
    metadata:
      labels: { app: redash, comp: web }
    spec:
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: web
          image: redash/redash:25.8.0
          args: ["server"]
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: redash-config
            - secretRef:
                name: redash-core-secrets
            - secretRef:
                name: redash-smtp-secrets
          env:
            - name: REDASH_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: redash-database-secrets
                  key: REDASH_DATABASE_URL
          readinessProbe:
            httpGet: { path: /ping, port: 5000 }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /ping, port: 5000 }
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 6
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: "350m", memory: "640Mi" }
            limits: { cpu: "1100m", memory: "1280Mi" }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
