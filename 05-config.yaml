apiVersion: v1
kind: ConfigMap
metadata:
  name: redash-config
  namespace: redash
data:
  PYTHONUNBUFFERED: "0"
  REDASH_LOG_LEVEL: "INFO"

  # Redis en-cluster
  REDASH_REDIS_URL: "redis://redash-redis.redash.svc.cluster.local:6379/0"

  # Balance entre conexiones a Supabase y manejo de pestañas concurrentes
  REDASH_WEB_WORKERS: "2"
  REDASH_DATABASE_POOL_SIZE: "3"
  REDASH_DATABASE_MAX_OVERFLOW: "2"

  REDASH_HOST: "https://redash.redsign98.net"
