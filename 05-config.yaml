apiVersion: v1
kind: ConfigMap
metadata:
  name: redash-config
  namespace: redash
data:
  PYTHONUNBUFFERED: "0"
  REDASH_LOG_LEVEL: "INFO"

  # Redis en-cluster
  REDASH_REDIS_URL: "redis://redash-redis.redash.svc.cluster.local:6379/0"

  # Minimiza conexiones al Postgres de Supabase
  REDASH_WEB_WORKERS: "1"
  REDASH_DATABASE_POOL_SIZE: "1"
  REDASH_DATABASE_MAX_OVERFLOW: "0"

  REDASH_HOST: "https://redash-dev.redsign98.net"
