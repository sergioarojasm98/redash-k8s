apiVersion: v1
kind: Service
metadata:
  name: cloudflared-tunnel
  namespace: redash
  labels: { app: cloudflared-tunnel }
spec:
  type: ClusterIP
  selector: { app: cloudflared-tunnel }
  ports:
    - name: metrics
      port: 2000
      targetPort: 2000
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-tunnel
  namespace: redash
  labels: { app: cloudflared-tunnel }
spec:
  revisionHistoryLimit: 2
  replicas: 2
  selector:
    matchLabels: { app: cloudflared-tunnel }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels: { app: cloudflared-tunnel }
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2025.8.0
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: redash-dev-cloudflared-token
                  key: token
          command:
            - cloudflared
          args:
            - tunnel
            - --no-autoupdate
            - --loglevel
            - info
            - --metrics
            - 0.0.0.0:2000
            - run
          livenessProbe:
            httpGet: { path: /ready, port: 2000 }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /ready, port: 2000 }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "200m", memory: "256Mi" }
