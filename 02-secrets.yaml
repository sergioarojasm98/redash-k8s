# =============================================================================
# SECRETS - Sensitive Configuration
# =============================================================================
# All secrets are populated from .env via deploy.sh using envsubst.
# DO NOT commit this file with actual values - use .env.example as template.
#
# Required environment variables in .env:
# - REDASH_COOKIE_SECRET: Session cookie encryption key
# - REDASH_SECRET_KEY: Application secret for tokens
# - REDASH_DATABASE_URL: PostgreSQL connection string (Supabase)
# - REDASH_MAIL_*: SMTP configuration for email notifications
# - TUNNEL_TOKEN: Cloudflare tunnel authentication token
# =============================================================================

# -----------------------------------------------------------------------------
# Secret: redash-core-secrets
# Core application secrets for Redash security
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: redash-core-secrets
  namespace: redash
  labels:
    app: redash
type: Opaque
stringData:
  REDASH_COOKIE_SECRET: "${REDASH_COOKIE_SECRET}"
  REDASH_SECRET_KEY: "${REDASH_SECRET_KEY}"

---
# -----------------------------------------------------------------------------
# Secret: redash-smtp-secrets
# Email/SMTP configuration for alerts and invitations
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: redash-smtp-secrets
  namespace: redash
  labels:
    app: redash
type: Opaque
stringData:
  REDASH_MAIL_SERVER: "${REDASH_MAIL_SERVER}"
  REDASH_MAIL_PORT: "${REDASH_MAIL_PORT}"
  REDASH_MAIL_USE_SSL: "${REDASH_MAIL_USE_SSL}"
  REDASH_MAIL_USE_TLS: "${REDASH_MAIL_USE_TLS}"
  REDASH_MAIL_USERNAME: "${REDASH_MAIL_USERNAME}"
  REDASH_MAIL_PASSWORD: "${REDASH_MAIL_PASSWORD}"
  REDASH_MAIL_DEFAULT_SENDER: "${REDASH_MAIL_DEFAULT_SENDER}"

---
# -----------------------------------------------------------------------------
# Secret: redash-database-secrets
# PostgreSQL connection (Supabase hosted)
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: redash-database-secrets
  namespace: redash
  labels:
    app: redash
type: Opaque
stringData:
  REDASH_DATABASE_URL: "${REDASH_DATABASE_URL}"

---
# -----------------------------------------------------------------------------
# Secret: redash-cloudflared-token
# Cloudflare Tunnel authentication for zero-trust access
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: redash-cloudflared-token
  namespace: redash
  labels:
    app: cloudflared
type: Opaque
stringData:
  token: "${TUNNEL_TOKEN}"
