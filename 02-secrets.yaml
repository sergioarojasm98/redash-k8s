# Redash Core Secrets - will be populated by deploy.sh from .env
apiVersion: v1
kind: Secret
metadata:
  name: redash-core-secrets
  namespace: redash
type: Opaque
stringData:
  REDASH_COOKIE_SECRET: "${REDASH_COOKIE_SECRET}"
  REDASH_SECRET_KEY: "${REDASH_SECRET_KEY}"
---
# SMTP Secrets - will be populated by deploy.sh from .env
apiVersion: v1
kind: Secret
metadata:
  name: redash-smtp-secrets
  namespace: redash
type: Opaque
stringData:
  REDASH_MAIL_SERVER: "${REDASH_MAIL_SERVER}"
  REDASH_MAIL_PORT: "${REDASH_MAIL_PORT}"
  REDASH_MAIL_USE_SSL: "${REDASH_MAIL_USE_SSL}"
  REDASH_MAIL_USE_TLS: "${REDASH_MAIL_USE_TLS}"
  REDASH_MAIL_USERNAME: "${REDASH_MAIL_USERNAME}"
  REDASH_MAIL_PASSWORD: "${REDASH_MAIL_PASSWORD}"
  REDASH_MAIL_DEFAULT_SENDER: "${REDASH_MAIL_DEFAULT_SENDER}"
---
# Database Secrets - will be populated by deploy.sh from .env
apiVersion: v1
kind: Secret
metadata:
  name: redash-database-secrets
  namespace: redash
type: Opaque
stringData:
  REDASH_DATABASE_URL: "${REDASH_DATABASE_URL}"
---
# Cloudflared Secrets - will be populated by deploy.sh from .env
apiVersion: v1
kind: Secret
metadata:
  name: redash-cloudflared-token
  namespace: redash
type: Opaque
stringData:
  token: "${TUNNEL_TOKEN}"